name: Sync upstream and release

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-upstream.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync upstream and tag new versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync upstream
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/mangeshghodke/DreamPlayer.git
          git fetch upstream main --tags
          BEFORE="$(git rev-parse HEAD)"
          git merge --no-edit -X ours upstream/main
          AFTER="$(git rev-parse HEAD)"
          if [ "$BEFORE" = "$AFTER" ]; then
            echo 'changed=false' >> "$GITHUB_ENV"
          else
            git push origin main
            echo 'changed=true' >> "$GITHUB_ENV"
          fi
      - name: Detect version
        id: version
        run: |
          VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml | cut -d+ -f1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check release
        id: release
        env:
          GH_TOKEN: '${{ github.token }}'
          TAG: 'v${{ steps.version.outputs.version }}'
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Ensure release tag
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: '${{ github.token }}'
          TAG: 'v${{ steps.version.outputs.version }}'
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Origin tag $TAG already exists; using it."
          else
            git tag "$TAG" HEAD
            git push origin "$TAG"
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
